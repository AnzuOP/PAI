<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
</head>
<body>
    <h1 id="hello">Cześć świat</h1>

    <button id="send" onclick="send()">Wyślij</button>

    <br>

    <form>
        <label for="price">Cena</label>
        <input type ="number" id="price" name="price"> <br>

        <label for="amount">Ilość</label>
        <input type ="number" id="amount" name="amount"><br>

        <button type="button" id="btnCalculate" onclick="calculate()">Oblicz</button>  

        <p id="result"></p>
    </form>    

    <br>

    <form>
        <label for="length">Dlugosc podlogi (w metrach)</label>
        <input type ="number" id="length" name="length"> <br>

        <label for="width">Szerokosc podlogi (w metrach) </label>
        <input type ="number" id="width" name="width"><br>

        <label for="plate">Powierzchnia płytek (w metrach kwadratowych) </label>
        <input type ="number" id="plate" name="plate"><br>

        <button type="button" onclick="obliczPlytki()">Oblicz</button>    </form>  

        <p id="res"></p>

    <script>
        //zmiana tekstu
        function send(){
            document.getElementById("hello").textContent = "Udało ci się!";
        }
        //funkcja licząca iloczyn ceny i ilosci
        function calculate(){
            let p = document.getElementById("price").value;
            let n = document.getElementById("amount").value;

            document.getElementById("result").textContent = "Cena to: " + (p * n) + "zł";    
        }
        //funkcja licząca ilość płytek
        function obliczPlytki() {
            let l = Number(document.getElementById("length").value);
            let w = Number(document.getElementById("width").value);
            let p = Number(document.getElementById("plate").value);

            let podloga = l * w;
            let ilosc = Math.ceil(podloga / p);

            document.getElementById("res").textContent = "Ilość płytek: " + ilosc;
}
    </script>
</body>
</html>
